<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#241510">
  <title>الإمداد العصري — معاينة خاصة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
  <style>
    :root {
      --bg: #241510; --bg-2: #3b241c; --paper: #f1e8db; --cream: #fbf7f1; --gold: #b89b72; --gold-soft: #d6c09d;
      --ink: #29211d; --ink-soft: #6b5a4e; --line: rgb(59 36 28 / 14%); --danger: #b84a3a; --ok: #6f8f5f;
      --font: "IBM Plex Sans Arabic", system-ui, sans-serif; --display: "Amiri", "Noto Naskh Arabic", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font); color: var(--ink); background: var(--bg);
      background-image:
        radial-gradient(1200px 600px at 80% -10%, rgb(184 155 114 / 22%), transparent 60%),
        radial-gradient(800px 500px at 10% 110%, rgb(224 122 58 / 14%), transparent 60%);
      display: grid; place-items: center; padding: 24px; min-height: 100dvh;
    }
    .card {
      width: min(440px, 100%); background: var(--paper); border-radius: 26px; padding: 40px 36px 32px;
      box-shadow: 0 40px 80px -30px rgb(0 0 0 / 55%), inset 0 1px 0 rgb(255 255 255 / 60%);
      position: relative; overflow: hidden;
    }
    .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--gold), var(--gold-soft), var(--gold)); }
    .eyebrow { font: 500 11px/1 var(--font); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
    h1 { font: 700 clamp(28px, 6vw, 36px)/1.2 var(--display); margin: 0 0 6px; color: var(--bg); }
    .latin { font: 400 13px/1 var(--font); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 26px; direction: ltr; text-align: right; }
    p.lead { margin: 0 0 24px; color: var(--ink-soft); font-size: 14.5px; line-height: 1.9; }
    form { display: grid; gap: 12px; }
    label { font-size: 13px; font-weight: 500; color: var(--ink-soft); }
    .field { position: relative; }
    input[type=password], input[type=text] {
      width: 100%; height: 54px; border: 1px solid var(--line); border-radius: 14px; background: var(--cream);
      padding: 0 52px 0 16px; font: 500 17px/1 var(--font); color: var(--ink); letter-spacing: .08em; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgb(184 155 114 / 22%); }
    .eye { position: absolute; top: 0; right: 0; height: 54px; width: 50px; border: 0; background: transparent; cursor: pointer; color: var(--ink-soft); display: grid; place-items: center; }
    .eye svg { width: 20px; height: 20px; }
    button.go {
      height: 54px; border: 0; border-radius: 14px; background: var(--bg); color: var(--paper); font: 600 16px/1 var(--font);
      cursor: pointer; transition: transform .15s, background .2s, opacity .2s; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    button.go:hover { background: var(--bg-2); }
    button.go:active { transform: translateY(1px); }
    button.go[disabled] { opacity: .6; cursor: progress; }
    .status { min-height: 22px; font-size: 13.5px; line-height: 1.6; color: var(--ink-soft); margin-top: 4px; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .bar { height: 6px; border-radius: 999px; background: rgb(59 36 28 / 10%); overflow: hidden; display: none; margin-top: 6px; }
    .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); transition: width .25s; border-radius: inherit; }
    .bar.on { display: block; }
    .foot { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); line-height: 1.8; display: flex; gap: 10px; align-items: flex-start; }
    .foot svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--gold); }
    .spin { width: 16px; height: 16px; border: 2px solid rgb(255 255 255 / 35%); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; display: none; }
    .busy .spin { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .shake, .spin { animation: none; } }
  </style>
</head>
<body>
  <main class="card" id="card">
    <p class="eyebrow">Private preview</p>
    <h1>الإمداد العصري</h1>
    <p class="latin">Modern Supply</p>
    <p class="lead">هذه المعاينة سرّية ومخصّصة للعرض فقط. أدخل كلمة السر التي وصلتك للمتابعة.</p>
    <form id="f" autocomplete="off" novalidate>
      <label for="pw">كلمة السر</label>
      <div class="field">
        <input id="pw" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="••••••••" required>
        <button type="button" class="eye" id="eye" aria-label="إظهار كلمة السر" title="إظهار / إخفاء">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" class="go" id="go"><span class="spin"></span><span id="golabel">دخول إلى المعاينة</span></button>
      <div class="status" id="st" role="status" aria-live="polite"></div>
      <div class="bar" id="bar"><i id="bari"></i></div>
    </form>
    <div class="foot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span>المحتوى مشفّر بالكامل ولا يُفكّ تشفيره إلا داخل متصفحك بعد إدخال كلمة السر. يُمنع تحميل أو نسخ أو تصوير هذه المعاينة.</span>
    </div>
  </main>

  <script>
  (() => {
    "use strict";
    if (window.top !== window.self) { try { window.top.location.replace(location.href); } catch (e) {} }

    const CFG = {"salt":"pHKAOJ7O9ulAGIXa2tyFwA==","iv":"agn/MHM6yC44NZBD","iter":310000,"check":{"iv":"AHtcrLudTjvRtF29","ct":"nkQQIEoayzArpHcdiOMxjxV5sj9Vpd4fOqHtmIBbd6K/9JnT9+9b/A==","marker":"modern-supply-preview-ok"},"chunks":["payload-0.bin","payload-1.bin"],"size":11636870};

    const $ = (s) => document.querySelector(s);
    const f = $("#f"), pw = $("#pw"), go = $("#go"), st = $("#st"), bar = $("#bar"), bari = $("#bari"), card = $("#card"), eye = $("#eye");
    const enc = new TextEncoder(), dec = new TextDecoder();
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    let fails = 0, lockedUntil = 0;

    eye.addEventListener("click", () => { pw.type = pw.type === "password" ? "text" : "password"; pw.focus(); });

    const setStatus = (msg, cls) => { st.textContent = msg; st.className = "status" + (cls ? " " + cls : ""); };
    const setBusy = (b, label) => { go.disabled = b; card.classList.toggle("busy", b); if (label) $("#golabel").textContent = label; };
    const progress = (done, total) => { bar.classList.add("on"); bari.style.width = Math.min(100, Math.round((done / total) * 100)) + "%"; };

    if (!(window.crypto && crypto.subtle)) {
      setStatus("هذا المتصفح لا يدعم فك التشفير الآمن. افتح الرابط عبر متصفح حديث (Chrome أو Safari) وبرابط https.", "err");
      go.disabled = true;
    }

    async function deriveKey(password) {
      const base = await crypto.subtle.importKey("raw", enc.encode(password.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(CFG.salt), iterations: CFG.iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
    }

    async function verify(key) {
      try {
        const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(CFG.check.iv) }, key, b64(CFG.check.ct));
        return dec.decode(pt) === CFG.check.marker;
      } catch (e) { return false; }
    }

    async function fetchAll() {
      const parts = []; let done = 0;
      for (const name of CFG.chunks) {
        const res = await fetch(name, { cache: "force-cache" });
        if (!res.ok) throw new Error("fetch " + name + " " + res.status);
        if (!res.body) { const buf = new Uint8Array(await res.arrayBuffer()); parts.push(buf); done += buf.length; progress(done, CFG.size); continue; }
        const reader = res.body.getReader(); const bufs = []; let n = 0;
        for (;;) { const { value, done: d } = await reader.read(); if (d) break; bufs.push(value); n += value.length; done += value.length; progress(done, CFG.size); }
        const out = new Uint8Array(n); let o = 0; for (const b of bufs) { out.set(b, o); o += b.length; }
        parts.push(out);
      }
      const total = parts.reduce((a, b) => a + b.length, 0);
      const all = new Uint8Array(total); let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
      return all;
    }

    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now < lockedUntil) { setStatus("محاولات كثيرة. انتظر " + Math.ceil((lockedUntil - now) / 1000) + " ثانية ثم أعد المحاولة.", "err"); return; }
      const password = pw.value.trim();
      if (!password) { pw.focus(); return; }

      setBusy(true, "جارٍ التحقق…"); setStatus("");
      try {
        const key = await deriveKey(password);
        if (!(await verify(key))) {
          fails++;
          if (fails >= 5) lockedUntil = Date.now() + 30000 * (fails - 4);
          setBusy(false, "دخول إلى المعاينة");
          setStatus("كلمة السر غير صحيحة.", "err");
          card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
          pw.select(); return;
        }
        setStatus("كلمة السر صحيحة. جارٍ تحميل المعاينة…", "ok"); setBusy(true, "جارٍ التحميل…");
        const ct = await fetchAll();
        setBusy(true, "جارٍ فك التشفير…"); setStatus("جارٍ فك التشفير وتجهيز الصفحة…", "ok");
        const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(CFG.iv) }, key, ct);
        const html = dec.decode(pt);
        pw.value = "";
        document.open(); document.write(html); document.close();
      } catch (err) {
        console.error(err);
        setBusy(false, "دخول إلى المعاينة");
        setStatus("تعذّر تحميل المعاينة. تحقق من اتصالك بالإنترنت ثم أعد المحاولة.", "err");
      }
    });
    pw.focus();
  })();
  </script>
</body>
</html>
